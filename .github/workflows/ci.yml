name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

env:
  COMPONENT_PATH: target/wasm32-wasip2/release/onedrive_davfs.wasm
  HOST_MANIFEST: host/Cargo.toml
  HOST_BINARY_PATH: host/target/release/onedrive-davfs-host
  WASM_TOOLS_VERSION: 1.244.0

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip2
          components: rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install wasm-tools
        run: cargo install wasm-tools --version "${WASM_TOOLS_VERSION}" --locked

      - name: Run unit tests
        run: cargo test --lib

      - name: Run host tests
        run: cargo test --manifest-path "${HOST_MANIFEST}"

      - name: Check formatting for handwritten Rust sources
        run: |
          git ls-files '*.rs' \
            | grep -v '^src/bindings.rs$' \
            | xargs rustfmt --check --edition 2024 --config skip_children=true

      - name: Build release component
        run: cargo build --target wasm32-wasip2 --release

      - name: Build native host
        run: cargo build --manifest-path "${HOST_MANIFEST}" --release

      - name: Validate WebAssembly component
        run: wasm-tools validate "${COMPONENT_PATH}"

      - name: Upload WebAssembly artifact
        uses: actions/upload-artifact@v4
        with:
          name: onedrive_davfs-wasm
          path: ${{ env.COMPONENT_PATH }}
          if-no-files-found: error

      - name: Upload host artifact
        uses: actions/upload-artifact@v4
        with:
          name: onedrive-davfs-host-linux-x86_64
          path: ${{ env.HOST_BINARY_PATH }}
          if-no-files-found: error
